<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin BMKG</title><style>
:root{--navy:#002b49;--blue:#0072ce;--line:#d9e3e9}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#142c3d;font:15px/1.5 Segoe UI,Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px}.wrap{width:min(1180px,calc(100% - 32px));margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #002b4912}.login{max-width:430px;margin:50px auto}label{display:grid;gap:6px;font-weight:700;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd9e1;border-radius:7px}input,select,textarea{width:100%}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:12px 8px;border-bottom:1px solid var(--line)}th{color:#456}small{color:#607384}.actions{display:grid;gap:8px;min-width:220px}textarea{min-height:70px}.notice{padding:10px;border-radius:7px;margin:10px 0;background:#e7f5ed;color:#17623c}.error{background:#ffe8ea;color:#98263a}
</style></head><body><header class="top"><div class="wrap"><b>Panel Admin BMKG Deli Serdang</b> · <a href="index.html" style="color:#fff">Kembali ke situs</a></div></header><main class="wrap"><section id="loginCard" class="card login"><h1>Login Admin</h1><p>Masuk dengan akun admin Supabase.</p><div id="loginMessage"></div><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Masuk</button></form></section><section id="adminApp" class="hidden"><div class="card"><button class="secondary" id="logout">Keluar</button><span id="message"></span></div><section class="card"><h1>Permintaan Masuk</h1><p><small>Perbarui status atau tulis catatan untuk pemohon.</small></p><div style="overflow:auto"><table><thead><tr><th>Tiket / Pemohon</th><th>Jenis & detail</th><th>Tanggal</th><th>Tindak lanjut</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://mbxmvlbfucsppjwnpmcb.supabase.co','sb_publishable_VL_PnIkZpShaPwo2X-D0ew_K1Z--daE');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function say(text,error=false){$('message').textContent=text;$('message').className=text?'notice '+(error?'error':''):''}function admin(show){$('loginCard').classList.toggle('hidden',show);$('adminApp').classList.toggle('hidden',!show)}
async function load(){const {data,error}=await db.from('service_requests').select('*').order('created_at',{ascending:false});if(error){say(error.message,true);return;}$('rows').innerHTML=data.map(r=>`<tr><td><b>${esc(r.ticket)}</b><br>${esc(r.nama)}<br><small>${esc(r.email)} · ${esc(r.no_hp)}</small></td><td><b>${esc(r.request_type)}</b><br>${esc(r.jenis_data?.join(', ')||r.jenis_pendaftaran||r.kategori_aduan||'—')}<br>${esc(r.wilayah||r.instansi||'')}</td><td><small>${new Date(r.created_at).toLocaleString('id-ID')}</small></td><td><div class="actions"><select data-status="${r.id}"><option ${r.status==='Proses Verifikasi'?'selected':''}>Proses Verifikasi</option><option ${r.status==='Menunggu Verifikasi'?'selected':''}>Menunggu Verifikasi</option><option ${r.status==='Diterima'?'selected':''}>Diterima</option><option ${r.status==='Selesai / Data Dikirimkan'?'selected':''}>Selesai / Data Dikirimkan</option><option ${r.status==='Selesai Ditindaklanjuti'?'selected':''}>Selesai Ditindaklanjuti</option><option ${r.status==='Ditolak'?'selected':''}>Ditolak</option></select><textarea data-note="${r.id}" placeholder="Catatan admin">${esc(r.catatan_admin||'')}</textarea><button data-save="${r.id}">Simpan</button></div></td></tr>`).join('')||'<tr><td colspan="4">Belum ada permintaan.</td></tr>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save;const status=document.querySelector(`[data-status="${id}"]`).value;const catatan_admin=document.querySelector(`[data-note="${id}"]`).value;const {error}=await db.from('service_requests').update({status,catatan_admin}).eq('id',id);if(error)return say(error.message,true);say('Perubahan disimpan.');load();});}
async function start(){const {data:{session}}=await db.auth.getSession();if(session){admin(true);load();}}$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMessage').textContent=error.message;return;}admin(true);load();};$('logout').onclick=async()=>{await db.auth.signOut();admin(false);};start();
</script></body></html>
