<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin BMKG</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="top"><div class="wrap"><b>Panel Admin BMKG Deli Serdang</b> · <a href="index.html" style="color:#fff">Kembali ke situs</a></div></header>
  <main class="wrap">
    <section id="loginCard" class="card login">
      <h1>Login Admin</h1><p>Masuk dengan akun admin Supabase.</p>
      <div id="loginMessage"></div>
      <form id="loginForm">
        <label>Email<input id="email" type="email" required></label>
        <label>Password<input id="password" type="password" required></label>
        <button type="submit">Masuk</button>
      </form>
    </section>
    <section id="adminApp" class="hidden">
      <div class="card"><button class="secondary" id="logout" type="button">Keluar</button><span id="message"></span></div>
      <section class="card">
        <h1>Manajemen Layanan</h1>
        <p><small>Pilih jenis layanan. Alur Pendaftaran tidak memiliki proses pembayaran.</small></p>
        <div class="tabs">
          <button data-tab="registration" class="active" type="button">Admin Pendaftaran</button>
          <button data-tab="geophysics" type="button">Admin Pelayanan Jasa Geofisika</button>
          <button data-tab="complaint" type="button">Aduan Masyarakat</button>
        </div>
      </section>
      <section class="card"><div style="overflow:auto">
        <table><thead><tr><th>Tiket / Pemohon</th><th>Detail layanan</th><th>Dokumen permohonan</th><th>Tindak lanjut</th></tr></thead><tbody id="rows"></tbody></table>
      </div></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
