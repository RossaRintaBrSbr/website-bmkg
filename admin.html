<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin BMKG</title>
<style>:root{--navy:#002b49;--blue:#0072ce;--line:#d9e3e9;--mist:#f4f7fa}*{box-sizing:border-box}body{margin:0;background:var(--mist);color:#142c3d;font:15px/1.5 Segoe UI,Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px}.wrap{width:min(1240px,calc(100% - 32px));margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #002b4912}.login{max-width:430px;margin:50px auto}label{display:grid;gap:6px;font-weight:700;margin:10px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd9e1;border-radius:7px}input,select,textarea{width:100%}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary,.tabs button{background:#fff;color:var(--navy);border:1px solid var(--line)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:12px 8px;border-bottom:1px solid var(--line)}th{color:#456}.actions{display:grid;gap:8px;min-width:250px}textarea{min-height:75px}.notice{display:inline-block;padding:10px;border-radius:7px;margin-left:10px;background:#e7f5ed;color:#17623c}.error{background:#ffe8ea;color:#98263a}.doc{color:#005ea8;font-weight:700;display:inline-block}.badge{display:inline-block;background:#e8f4fc;color:#005b9e;border-radius:99px;padding:3px 8px;font-size:12px;font-weight:800}.details{display:grid;gap:3px;min-width:240px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:760px){.wrap{width:min(100% - 20px,1240px)}.card{padding:15px}.two{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="wrap"><b>Panel Admin BMKG Deli Serdang</b> · <a href="index.html" style="color:#fff">Kembali ke situs</a></div></header>
<main class="wrap"><section id="loginCard" class="card login"><h1>Login Admin</h1><p>Masuk dengan akun admin Supabase.</p><div id="loginMessage"></div><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Masuk</button></form></section>
<section id="adminApp" class="hidden"><div class="card"><button class="secondary" id="logout">Keluar</button><span id="message"></span></div><section class="card"><h1>Manajemen Layanan</h1><p><small>Pilih jenis layanan. Alur Pendaftaran tidak memiliki proses pembayaran.</small></p><div class="tabs"><button data-tab="registration" class="active">Admin Pendaftaran</button><button data-tab="geophysics">Admin Pelayanan Jasa Geofisika</button><button data-tab="complaint">Aduan Masyarakat</button></div></section><section class="card"><div style="overflow:auto"><table><thead><tr><th>Tiket / Pemohon</th><th>Detail layanan</th><th>Dokumen</th><th>Tindak lanjut</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://mbxmvlbfucsppjwnpmcb.supabase.co','sb_publishable_VL_PnIkZpShaPwo2X-D0ew_K1Z--daE'),$=id=>document.getElementById(id);let tab='registration',all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const isGeo=r=>['pelayanan_jasa_geofisika','permintaan_data'].includes(r.request_type);const link=(u,t)=>u?'<a class="doc" href="'+esc(u)+'" target="_blank" rel="noopener">'+t+'</a>':'<small>—</small>';function say(t,e){$('message').textContent=t;$('message').className=t?'notice '+(e?'error':''):''}function app(show){$('loginCard').classList.toggle('hidden',show);$('adminApp').classList.toggle('hidden',!show)}function options(cur,items){return items.map(x=>'<option '+(x===cur?'selected':'')+'>'+x+'</option>').join('')}function filtered(){return all.filter(r=>tab==='registration'?r.request_type==='pendaftaran':tab==='geophysics'?isGeo(r):r.request_type==='aduan')}function actionHtml(r){const reg=r.request_type==='pendaftaran',statuses=reg?['Permohonan Diterima','Diproses','Selesai','Ditolak']:isGeo(r)?['Permohonan Diterima','Menunggu Pembayaran','Pembayaran Dikirim','Pembayaran Terverifikasi','Data/Permohonan Diproses','Selesai','Ditolak']:['Diterima','Diproses','Selesai Ditindaklanjuti','Ditolak'];let s='<div class="actions"><select data-status="'+r.id+'">'+options(r.status,statuses)+'</select><textarea data-note="'+r.id+'" placeholder="Catatan admin untuk pemohon">'+esc(r.catatan_admin||'')+'</textarea>';if(isGeo(r))s+='<div class="two"><label>Nominal pembayaran<input data-amount="'+r.id+'" type="number" min="0" value="'+esc(r.payment_amount||'')+'"></label><label>Informasi pembayaran<textarea data-payinfo="'+r.id+'" placeholder="Rekening / instruksi">'+esc(r.payment_info||'')+'</textarea></label></div><label>PDF informasi pembayaran<input data-payment-doc="'+r.id+'" type="file" accept="application/pdf"></label>'+link(r.payment_document_url,'Buka PDF pembayaran')+'<label>Barcode pembayaran<input data-barcode="'+r.id+'" type="file" accept="image/png,image/jpeg"></label>'+link(r.payment_barcode_url,'Buka barcode')+'<label>Hasil pelayanan<input data-result="'+r.id+'" type="file" accept="application/pdf,image/png,image/jpeg"></label>'+link(r.service_result_url||r.response_file_url,'Buka hasil saat ini');return s+'<button data-save="'+r.id+'">Simpan perubahan</button></div>'}function render(){const data=filtered();$('rows').innerHTML=data.map(r=>{const reg=r.request_type==='pendaftaran',kind=reg?'Pendaftaran':isGeo(r)?'Jasa Geofisika':'Aduan',detail=reg?'Mulai: '+esc(r.tanggal_mulai)+'<br>Selesai: '+esc(r.tanggal_selesai):isGeo(r)?'Lokasi: '+esc(r.wilayah)+'<br>Tanggal awal: '+esc(r.tanggal_mulai):'Lokasi: '+esc(r.wilayah),docs=link(r.supporting_document_url,'Buka Surat Permohonan')+(r.file_name?'<br><small>'+esc(r.file_name)+'</small>':'')+(isGeo(r)&&r.payment_proof_url?'<hr>'+link(r.payment_proof_url,'Buka bukti pembayaran'):'');return '<tr><td><b>'+esc(r.ticket)+'</b><br>'+esc(r.nama)+'<br><small>'+esc(r.email)+' · '+esc(r.no_hp)+'</small></td><td class="details"><span class="badge">'+kind+'</span><b>'+esc(r.jenis_pendaftaran||(r.jenis_data||[]).join(', ')||r.kategori_aduan||'—')+'</b><span>'+esc(r.instansi||'')+'</span><span>'+detail+'</span><small>'+new Date(r.created_at).toLocaleString('id-ID')+'</small></td><td>'+docs+'</td><td>'+actionHtml(r)+'</td></tr>'}).join('')||'<tr><td colspan="4">Belum ada data pada layanan ini.</td></tr>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save))}async function upload(file,id,kind){if(!file)return null;if(file.size>5*1024*1024)throw Error('Ukuran berkas maksimal 5 MB.');const path=id+'/'+kind+'-'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await db.storage.from('dokumen-admin').upload(path,file,{contentType:file.type});if(up.error)throw up.error;return db.storage.from('dokumen-admin').getPublicUrl(path).data.publicUrl}async function save(id){const r=all.find(x=>String(x.id)===String(id)),patch={status:document.querySelector('[data-status="'+id+'"]').value,catatan_admin:document.querySelector('[data-note="'+id+'"]').value};try{if(isGeo(r)){patch.payment_amount=document.querySelector('[data-amount="'+id+'"]').value||null;patch.payment_info=document.querySelector('[data-payinfo="'+id+'"]').value||null;const a=await upload(document.querySelector('[data-payment-doc="'+id+'"]').files[0],id,'pembayaran'),b=await upload(document.querySelector('[data-barcode="'+id+'"]').files[0],id,'barcode'),c=await upload(document.querySelector('[data-result="'+id+'"]').files[0],id,'hasil');if(a)patch.payment_document_url=a;if(b)patch.payment_barcode_url=b;if(c)patch.service_result_url=c}const{error}=await db.from('service_requests').update(patch).eq('id',id);if(error)throw error;say('Perubahan berhasil disimpan.');load()}catch(e){say(e.message,true)}}async function load(){const{data,error}=await db.from('service_requests').select('*').order('created_at',{ascending:false});if(error)return say(error.message,true);all=data;render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return $('loginMessage').textContent=error.message;app(true);load()};$('logout').onclick=async()=>{await db.auth.signOut();app(false)};(async()=>{const{data:{session}}=await db.auth.getSession();if(session){app(true);load()}})()})();
</script></body></html>
